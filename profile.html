<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suspiro — perfil</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/app.css"></head><body class="app-body" data-page="profile"><div class="app-shell"><aside class="sidebar"><div class="logo-script">Suspiro</div><nav class="nav"><a class="nav-link" data-nav="feed" href="feed.html"><span class="icon">⌂</span><span>Início</span></a><a class="nav-link" data-nav="explore" href="explore.html"><span class="icon">⌕</span><span>Explorar</span></a><a class="nav-link" data-nav="notifications" href="notifications.html"><span class="icon">♧</span><span>Notificações</span></a><a class="nav-link" data-nav="messages" href="messages.html"><span class="icon">✉</span><span>Mensagens</span></a><a class="nav-link" href="#favorites"><span class="icon">♡</span><span>Favoritos</span></a><a class="nav-link" data-nav="profile" href="profile.html"><span class="icon">♙</span><span>Perfil</span></a><a class="nav-link" data-nav="settings" href="settings.html"><span class="icon">⚙</span><span>Configurações</span></a><a class="nav-link" data-nav="report" href="report.html"><span class="icon">⚑</span><span>Segurança</span></a></nav><div class="sidebar-bottom"><div class="sidebar-user"><div class="avatar sm" data-profile-avatar data-profile-initial>V</div><div class="meta"><strong data-profile-name></strong><span data-profile-user></span></div></div></div></aside>
<main class="main-area"><div class="page-grid"><section class="content-column"><header class="page-header"><div><h1>Perfil</h1><span>Seu espaço dentro do Suspiro.</span></div></header><div class="profile-cover" id="profile-cover"></div><div class="profile-info"><div class="profile-topline"><div class="avatar lg" id="profile-avatar" data-profile-avatar data-profile-initial>V</div><button class="btn btn-outline btn-sm" id="edit-profile">Editar perfil</button></div><div class="profile-names"><h2 id="profile-name"></h2><span id="profile-username"></span></div><p class="profile-bio" id="profile-bio"></p><div class="profile-stats"><div><strong id="stat-posts">0</strong>Publicações</div><div><strong id="stat-followers">0</strong>Seguidores</div><div><strong id="stat-following">0</strong>Seguindo</div></div></div><div class="favorites-row" id="favorites"><div class="section-title"><h3>TOPS FAVORITOS</h3><button id="edit-favorites">Editar</button></div><div class="favorite-grid" id="favorite-grid"></div></div><div class="tabs"><button class="tab active" data-profile-filter="all">Publicações</button><button class="tab" data-profile-filter="dump">Dumps</button><button class="tab" data-profile-filter="thought">Pensamentos</button></div><div id="profile-posts"></div></section>
<aside class="right-column"><section class="side-card card"><div class="section-title"><h3>Sobre mim</h3><button id="edit-profile-2">Editar</button></div><div class="about-list" id="about-list"></div></section><button class="btn btn-primary" id="new-post" style="width:100%">Nova publicação</button></aside></div></main></div>
<nav class="mobile-bar"><a data-nav="feed" href="feed.html">⌂</a><a data-nav="explore" href="explore.html">⌕</a><a data-nav="notifications" href="notifications.html">♧</a><a data-nav="messages" href="messages.html">✉</a><a data-nav="profile" href="profile.html">♙</a></nav>
<div class="modal" id="profile-modal"><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-head"><strong>Editar perfil</strong><button class="icon-btn" data-close-modal="profile-modal">×</button></div><form id="profile-form" class="modal-body form-stack"><label>Nome<input class="field" name="name" required maxlength="50"></label><label>Usuário<input class="field" name="username" required maxlength="24"></label><label>Bio<textarea class="field" name="bio" maxlength="220"></textarea></label><label>Cidade<input class="field" name="city" maxlength="80"></label><label>Links (um por linha)<textarea class="field" name="links" maxlength="400"></textarea></label><div class="avatar-picker"><div class="avatar-picker-title"><strong>Escolha uma imagem pronta</strong><span>Ou use uma foto sua.</span></div><div class="avatar-preset-grid"><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/guitar.webp" aria-label="Guitarra" aria-pressed="false"><img src="assets/img/avatars/guitar.webp" alt="Guitarra"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/headphones.webp" aria-label="Fones" aria-pressed="false"><img src="assets/img/avatars/headphones.webp" alt="Fones"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/controller.webp" aria-label="Controle" aria-pressed="false"><img src="assets/img/avatars/controller.webp" alt="Controle"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/black-cat.webp" aria-label="Gato" aria-pressed="false"><img src="assets/img/avatars/black-cat.webp" alt="Gato"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/fox.webp" aria-label="Raposa" aria-pressed="false"><img src="assets/img/avatars/fox.webp" alt="Raposa"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/robot.webp" aria-label="Robô" aria-pressed="false"><img src="assets/img/avatars/robot.webp" alt="Robô"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/panda.webp" aria-label="Panda" aria-pressed="false"><img src="assets/img/avatars/panda.webp" alt="Panda"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/skull.webp" aria-label="Caveira" aria-pressed="false"><img src="assets/img/avatars/skull.webp" alt="Caveira"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/spray.webp" aria-label="Spray" aria-pressed="false"><img src="assets/img/avatars/spray.webp" alt="Spray"></button><button type="button" class="avatar-preset" data-avatar-preset="assets/img/avatars/music-bolt.webp" aria-label="Música" aria-pressed="false"><img src="assets/img/avatars/music-bolt.webp" alt="Música"></button></div><input type="hidden" name="presetAvatar" value=""></div><div class="upload-row"><label class="upload-btn">Foto de perfil<input type="file" name="avatar" accept="image/*" hidden></label><label class="upload-btn">Imagem de capa<input type="file" name="cover" accept="image/*" hidden></label></div><button class="btn btn-primary">Salvar perfil</button></form></div></div>
<div class="modal" id="favorites-modal"><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-head"><strong>Editar favoritos</strong><button class="icon-btn" data-close-modal="favorites-modal">×</button></div><form id="favorites-form" class="modal-body form-stack"><label>Livro<input class="field" name="book"></label><label>Filme<input class="field" name="movie"></label><label>Jogo<input class="field" name="game"></label><label>Música<input class="field" name="music"></label><label>Palavras de interesse<textarea class="field" name="tags" placeholder="livros, filmes, música, jogos..."></textarea></label><button class="btn btn-primary">Salvar favoritos</button></form></div></div>
<script src="assets/js/state.js"></script><script src="assets/js/common.js"></script><script src="assets/js/profile.js"></script></body></html>
